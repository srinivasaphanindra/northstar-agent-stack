# Admin "Clients" dashboard (v0.3). Product numbers live here; personal handles/URLs do NOT.
# Handles are read at collect time from the configured source files (brand yaml, landing page, client guardrails).
# Every path may start with ~ and can be overridden by env (see .env.example). Missing files are skipped.
plans:
  viral:
    ai_budget_usd_month: 35
    warmup_weeks: 4
    # index = warm-up week (0..3); the last value holds after the warm-up
    caps:
      x:        { posts_per_day: [4, 8, 11, 15], replies_per_day: [8, 15, 23, 30] }
      linkedin: { posts_per_week: [4, 6, 9, 12], comments_per_day: [2, 3, 5, 6] }
      facebook: { posts_per_day: [1, 2, 2, 3], comments_per_day: [3, 5, 7, 9] }

clients:
  # One entry per client instance. Client instances (guardrails, audit log, helper, n8n bot) live OUTSIDE this repo;
  # see docs/new-client.md. Example entry with placeholder paths:
  - key: example-client
    name: "Example Client"
    plan: viral
    start_date: "2026-01-01"
    sources:
      guardrails_yaml: ${CLIENT_GUARDRAILS_PATH:-~/agency/clients/example-client/guardrails.yaml}
      audit_log: ${CLIENT_AUDIT_LOG_PATH:-~/agency/clients/example-client/audit-log.tsv}
      state_helper_url: ${CLIENT_STATE_URL:-http://127.0.0.1:8771}
      n8n_inbound_workflow: "Example Client bot"
