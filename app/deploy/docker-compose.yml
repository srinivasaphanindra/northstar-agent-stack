# docker compose -f deploy/docker-compose.yml --env-file .env up -d --build
services:
  db:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_DB: northstar
      POSTGRES_USER: northstar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
  migrate:
    build: { context: .., dockerfile: deploy/Dockerfile }
    env_file: ../.env
    environment: { DATABASE_URL: "postgresql://northstar:${POSTGRES_PASSWORD}@db:5432/northstar" }
    command: ["npx", "prisma", "db", "push", "--skip-generate", "--schema", "prisma/postgres/schema.prisma"]
    depends_on: [db]
  web:
    build: { context: .., dockerfile: deploy/Dockerfile }
    restart: always
    env_file: ../.env
    environment: { DATABASE_URL: "postgresql://northstar:${POSTGRES_PASSWORD}@db:5432/northstar", HOSTNAME: "0.0.0.0" }
    ports: ["127.0.0.1:3100:3100"]
    depends_on: [migrate]
  worker:
    build: { context: .., dockerfile: deploy/Dockerfile }
    restart: always
    env_file: ../.env
    environment: { DATABASE_URL: "postgresql://northstar:${POSTGRES_PASSWORD}@db:5432/northstar" }
    command: ["node", "node_modules/tsx/dist/cli.mjs", "worker/index.ts"]
    depends_on: [migrate]
volumes:
  pgdata: {}
